version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: resume-db
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: dinkar
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: resume-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resume_analyzer
      SPRING_DATASOURCE_USERNAME: dinkar
      SPRING_DATASOURCE_PASSWORD: password123